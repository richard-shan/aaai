runs_dir: runs
seed: 0
datasets: [math_train, math500, gsm8k, aime, gpqa_diamond]

model:
  hf_id: deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B
  tag: r1_qwen_1p5b
  dtype: float16
  cache_layers: [9, 12, 15, 18, 21, 24, 26, 27]
  probe_layer: 18        # sensor: strictly below steer_layer
  steer_layer: 21        # actuator
  think_tags: true
  device: auto

gen:
  temperature: 0.6
  top_p: 0.95
  max_think_tokens: 16384
  max_answer_tokens: 512
  n_rollouts: 4
  backend: vllm
  batch_size: 64

chunk:
  min_chunk_tokens: 12
  max_chunks: 160
  keep_first: 10
  keep_last: 5

forced:
  max_new_tokens: 32
  max_boundaries_per_rollout: 60
  dense_prefix: 20

probe:
  arch: linear
  l2: 0.001
  epochs: 200
  lr: 0.01
  n_folds: 5
  seeds: [0, 1, 2]

policy:
  kind: full
  tau_exit: 0.9
  tau_steer: 0.7
  alpha: 6.0
  patience_k: 2
  min_chunks: 4
  break_loops: true
  loop_patience: 3
  hysteresis: 0.1
  budget: 4096
  trial_agree_k: 2
