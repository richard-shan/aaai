[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reasoncontrol"
version = "0.1.0"
description = "Closed-loop interpretable latent-state controller for efficient reasoning LLMs"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.11",
    "transformers==5.14.1",
    "tokenizers>=0.20",
    "safetensors>=0.4",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15",
    "pyyaml>=6",
    "zstandard>=0.22",
    "math-verify>=0.9",
]

[project.optional-dependencies]
gpu = [
    # Resolve exact vllm pin on the GPU box (see README acceptance checklist);
    # vllm drives the torch pin there.
    "vllm>=0.26",
    "datasets>=3",
]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: requires GPU and downloaded models"]
addopts = "-m 'not gpu'"
